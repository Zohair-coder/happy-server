apiVersion: v1
kind: ConfigMap
metadata:
    name: happy-server-config
data:
    NODE_ENV: production
    PORT: "3005"
    REDIS_URL: redis://redis:6379
    S3_HOST: minio
    S3_PORT: "9000"
    S3_USE_SSL: "false"
    S3_BUCKET: happy-server
    S3_PUBLIC_URL: http://minio:9000/happy-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: happy-server
    labels:
        app: happy-server
spec:
    replicas: 1
    selector:
        matchLabels:
            app: happy-server
    template:
        metadata:
            labels:
                app: happy-server
        spec:
            initContainers:
                - name: migrate
                  image: happy-server:latest
                  command:
                      - yarn
                      - prisma
                      - migrate
                      - deploy
                  envFrom:
                      - configMapRef:
                            name: happy-server-config
                      - secretRef:
                            name: happy-server-secrets
            containers:
                - name: happy-server
                  image: happy-server:latest
                  ports:
                      - containerPort: 3005
                  envFrom:
                      - configMapRef:
                            name: happy-server-config
                      - secretRef:
                            name: happy-server-secrets
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3005
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3005
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 3005
                      failureThreshold: 30
                      periodSeconds: 5
---
