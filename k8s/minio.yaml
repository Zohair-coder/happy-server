apiVersion: apps/v1
kind: Deployment
metadata:
    name: minio
    labels:
        app: minio
spec:
    replicas: 1
    selector:
        matchLabels:
            app: minio
    template:
        metadata:
            labels:
                app: minio
        spec:
            containers:
                - name: minio
                  image: minio/minio:latest
                  args:
                      - server
                      - /data
                      - --console-address
                      - :9001
                  env:
                      - name: MINIO_ROOT_USER
                        valueFrom:
                            secretKeyRef:
                                name: happy-minio-secrets
                                key: MINIO_ROOT_USER
                      - name: MINIO_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: happy-minio-secrets
                                key: MINIO_ROOT_PASSWORD
                  ports:
                      - containerPort: 9000
                        name: api
                      - containerPort: 9001
                        name: console
                  volumeMounts:
                      - name: shared-pvc
                        mountPath: /data
                        subPath: minio
            volumes:
                - name: shared-pvc
                  persistentVolumeClaim:
                      claimName: shared-pvc
---
apiVersion: v1
kind: Service
metadata:
    name: minio
spec:
    selector:
        app: minio
    ports:
        - port: 9000
          targetPort: 9000
          name: api
        - port: 9001
          targetPort: 9001
          name: console
    type: NodePort
---
apiVersion: batch/v1
kind: Job
metadata:
    name: minio-init
spec:
    ttlSecondsAfterFinished: 300
    template:
        metadata:
            labels:
                app: minio-init
        spec:
            restartPolicy: OnFailure
            containers:
                - name: minio-init
                  image: minio/mc:latest
                  env:
                      - name: MINIO_ROOT_USER
                        valueFrom:
                            secretKeyRef:
                                name: happy-minio-secrets
                                key: MINIO_ROOT_USER
                      - name: MINIO_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: happy-minio-secrets
                                key: MINIO_ROOT_PASSWORD
                      - name: S3_BUCKET
                        value: happy-server
                  command:
                      - /bin/sh
                      - -c
                      - |
                        until /usr/bin/mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
                        /usr/bin/mc mb -p "local/$S3_BUCKET" || true;
                        /usr/bin/mc anonymous set download "local/$S3_BUCKET";
